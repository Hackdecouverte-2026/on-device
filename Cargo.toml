[package]
name = "on-device"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4"
hex = "0.4.3"
obfstr = "0.4.6"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1"
sysinfo = "0.40.3"
sysproxy = "0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Release hardening / obfuscation: strip symbols, single codegen unit, LTO,
# abort on panic. Combined with compile-time string obfuscation (obfstr).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
